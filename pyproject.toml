[project]
name = "memcodex"
version = "0.1.0"
description = "MemCodex: self-programming hierarchical memory for language agents (arXiv:2609.39765)"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"